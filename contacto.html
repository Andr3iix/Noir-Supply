            align-items: center;

            padding: 10px 20px;
        }
        header img {
            max-height: 60px;

        nav {
            display: flex;
            gap: 15px;
        }
        nav a {
            color: #fff;
            text-decoration: none;

        footer {

        <nav>

<div style="text-align: center; padding: 20px;">
    <h1>Contáctanos</h1>
    <form style="display: inline-block; text-align: left;">
        <label>Nombre:</label><br>
        <input type="text" style="width: 300px; padding: 5px;" required><br><br>
        <label>Correo Electrónico:</label><br>
        <input type="email" style="width: 300px; padding: 5px;" required><br><br>
        <label>Mensaje:</label><br>
        <textarea style="width: 300px; height: 100px; padding: 5px;" required></textarea><br><br>
        <button type="submit" style="padding: 10px 20px; background-color: #000; color: #fff; border: none; cursor: pointer;">Enviar</button>
    </form>
</div>
